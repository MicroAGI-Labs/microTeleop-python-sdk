[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "microteleop-python-sdk"
version = "0.2.0"
description = "Python SDK for microTeleop VR robot teleoperation and camera streaming"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "livekit>=1.0.12",
    "livekit-api>=1.0.5",
    "requests>=2.32.5",
    "numpy>=2,<3",
    "pydantic>=2.11,<3",
    "cryptography>=46,<51",
    "PyJWT>=2.10,<3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.black]
line-length = 120
target-version = ['py310', 'py311', 'py312']

[tool.isort]
profile = "black"
line_length = 120

[dependency-groups]
dev = ["pytest>=9,<10", "ruff>=0.16,<0.17"]
test = [
    "opencv-python>=4.8.0",
]
visualization = [
    "meshcat>=0.3.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
